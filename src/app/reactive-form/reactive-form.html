<p>reactive-form works!</p>




<form [formGroup]="myForm" (ngSubmit)="login()">
  <input type="text" formControlName="firstName">
   <input type="email" formControlName="email" email>    
   @if(myForm.controls.email.invalid && myForm.controls.email.touched){
       <p style="color: red">email format does not match</p>
   }
   <input type="password" formControlName="password">  
   
   <button [disabled]="myForm.invalid" type="submit">register / login / save</button>

</form>
